services:
  vulnerable:
    image: php:8.3.35-fpm
    volumes:
      - ./www:/var/www/html:z
    container_name: php_vulnerable

  patched:
    image: php:8.3.36-fpm
    volumes:
      - ./www:/var/www/html:z
    container_name: php_patched

  nginx-vuln:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./www:/var/www/html:z
      - ./nginx/vuln.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - vulnerable

  nginx-patched:
    image: nginx:latest
    ports:
      - "8082:80"
    volumes:
      - ./www:/var/www/html:z
      - ./nginx/patched.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - patched
